<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebuttal &mdash; Supplementary Materials</title>
<style>
  :root{
    --paper:#f7f5f0;
    --ink:#1c2b2a;
    --ink-soft:#5c6b68;
    --line:#d8d3c6;
    --accent:#2f5d5a;
    --accent-soft:#e4ece9;
    --code-bg:#eeeae0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    line-height:1.6;
  }
  header{
    padding:2.5rem 2rem 1.5rem;
    border-bottom:1px solid var(--line);
    max-width:1000px;
    margin:0 auto;
  }
  header .kicker{
    font-family:"IBM Plex Mono",Menlo,Consolas,monospace;
    font-size:0.72rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:0.5rem;
  }
  header h1{
    font-size:1.9rem;
    margin:0;
    font-weight:600;
  }
  header p.sub{
    color:var(--ink-soft);
    font-size:0.95rem;
    margin:0.4rem 0 0;
  }

  main{max-width:1000px;margin:0 auto;padding:0 2rem 4rem;}

  /* ---- Level 1 tabs: reviewers ---- */
  nav.tabs-l1{
    display:flex;
    gap:0.25rem;
    margin-top:1.5rem;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  nav.tabs-l1 button{
    font-family:"IBM Plex Mono",Menlo,Consolas,monospace;
    font-size:0.82rem;
    background:none;
    border:none;
    padding:0.7rem 1.1rem;
    cursor:pointer;
    color:var(--ink-soft);
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    transition:color .15s ease, border-color .15s ease;
  }
  nav.tabs-l1 button:hover{color:var(--ink);}
  nav.tabs-l1 button.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
    font-weight:600;
  }

  /* ---- Level 2 tabs: topics within a reviewer ---- */
  nav.tabs-l2{
    display:flex;
    gap:0.5rem;
    flex-wrap:wrap;
    margin:1.5rem 0 2rem;
  }
  nav.tabs-l2 button{
    font-family:"IBM Plex Mono",Menlo,Consolas,monospace;
    font-size:0.76rem;
    background:var(--code-bg);
    border:1px solid var(--line);
    border-radius:999px;
    padding:0.35rem 0.85rem;
    cursor:pointer;
    color:var(--ink-soft);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  nav.tabs-l2 button:hover{border-color:var(--accent);}
  nav.tabs-l2 button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }

  .panel{display:none;}
  .panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:translateY(0);}}

  .subpanel{display:none;}
  .subpanel.active{display:block;}

  figure{margin:1.75rem 0;}
  figure img{
    width:100%;
    display:block;
    border:1px solid var(--line);
    background:#fff;
  }
  figcaption{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-top:0.6rem;
  }
  figcaption b{color:var(--ink);}

  table{
    width:100%;
    border-collapse:collapse;
    margin:1.5rem 0;
    font-size:0.85rem;
  }
  th,td{
    padding:0.5rem 0.7rem;
    border-bottom:1px solid var(--line);
    text-align:left;
  }
  th{
    font-family:"IBM Plex Mono",Menlo,Consolas,monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-soft);
  }
  td.best{font-weight:700; color:var(--accent);}

  h2.section-title{
    font-size:1.05rem;
    margin:0 0 0.25rem;
  }
  p.note{color:var(--ink-soft); font-size:0.9rem;}

  .pdf-wrap{
    margin-top:1.75rem;
    border:1px solid var(--line);
    background:#fff;
  }
  .pdf-wrap iframe{
    width:100%;
    height:85vh;
    border:none;
    display:block;
  }
  .figure-row{
    display:flex;
    gap:1.5rem;
    margin:1.75rem 0;
    align-items:flex-start;
  }
  .figure-row figure{
    flex:1 1 0;
    min-width:0;
    margin:0;
  }
  .figure-row .pdf-wrap{
    margin-top:0;
  }
  .figure-row .pdf-wrap iframe{
    height:420px;
  }
  .figure-row figure img{
    height:420px;
    width:100%;
    object-fit:contain;
    background:#fff;
  }
  @media (max-width:720px){
    .figure-row{flex-direction:column;}
  }
  .pdf-fallback{
    padding:1.5rem;
    font-size:0.9rem;
    color:var(--ink-soft);
  }
  .pdf-fallback a{color:var(--accent);}

  ::selection{background:var(--accent-soft);}

  /* every panel is real markup, so the page still reads with scripts off */
  .no-js .panel,
  .no-js .subpanel {display:block;}
  .no-js nav.tabs-l1,
  .no-js nav.tabs-l2 {display:none;}
</style>
</head>
<body class="no-js">

<header>
  <h1>Rebuttal &mdash; Supplementary Materials</h1>
</header>

<main>
  <nav class="tabs-l1">
    <button class="active" data-panel="MbXe">Reviewer MbXe</button>
    <button data-panel="1JiD">Reviewer 1JiD</button>
    <button data-panel="manuscript">Revised Manuscript</button>
  </nav>

  <!-- ===================== Reviewer MbXe ===================== -->
  <div class="panel active" id="panel-MbXe">
    <nav class="tabs-l2">
      <button class="active" data-sub="MbXe_hyperparameter-sweep">Hyperparameter sweep</button>
      <button data-sub="MbXe_robustness">Robustness</button>
      <button data-sub="MbXe_ablation">Ablation</button>
    </nav>

    <div class="subpanel active" id="MbXe_hyperparameter-sweep">
        <div class="figure-row">
          <figure>
            <div class="pdf-wrap">
              <iframe data-src="Reviewer_MbXe/Hyperparameter_sweep/three_axis_interactive.html"
                      title="LOCOGEN three-axis operating surface"></iframe>
            </div>
            <figcaption><b>Figure 1.</b> Property / Authenticity / Plausibility three-axis interactive plot &mdash; drag to rotate, scroll to zoom.</figcaption>
          </figure>
          <figure>
            <img src="Reviewer_MbXe/Hyperparameter_sweep/balanced_score.png" alt="Balanced three-axis score bar chart">
            <figcaption><b>Figure 2.</b> Balanced score (P&middot;N&middot;Pl)<sup>1/3</sup> &mdash; LOCOGEN achieves the highest balanced score across sweep points.</figcaption>
          </figure>
        </div>
        <figure>
          <img src="Reviewer_MbXe/Hyperparameter_sweep/sweep_metrics_table.png" alt="Hyperparameter sweep metrics table">
          <figcaption><b>Figure 3.</b> Strength knob per method (in parentheses after each method): &lambda; = OOD/calibration strength (ood_lambda); r = property-pull ratio alpha_ratio at &lambda;=0.7 (paper default r=3.0 = the &lambda;=0.7 row; r=1/2 are lower-pull variants); cap = MDLM+CG classifier-guidance &alpha;-cap (alpha_cap); M = SVDD number of candidates per step (tweedie/SVDD-PM); tds &alpha; = SVDD-TDS importance-resampling temperature; gs = DNA-Diff classifier-free guidance scale (cond_weight; author base 1.0).</figcaption>
        </figure>
    </div>

    <div class="subpanel" id="MbXe_robustness">
        <h2 class="section-title">Robustness</h2>
        <p class="note">Fill in content here.</p>
    </div>

    <div class="subpanel" id="MbXe_ablation">
        <h2 class="section-title">Ablation</h2>
        <p class="note">Fill in content here.</p>
    </div>
  </div>

  <!-- ===================== Reviewer 1JiD ===================== -->
  <div class="panel" id="panel-1JiD" style="padding-top:2rem;">
    <div class="subpanel active" id="1JiD_non-generative-baselines">
        <h2 class="section-title">Non-generative baselines</h2>
        <p class="note">Fill in content here.</p>
    </div>
  </div>

  <!-- ===================== Revised manuscript ===================== -->
  <div class="panel" id="panel-manuscript" style="padding-top:2rem;">
    <div class="pdf-wrap">
      <iframe data-src="revised_manuscript.pdf" title="Revised Manuscript"></iframe>
    </div>
    <p class="pdf-fallback">
      If the PDF doesn't display, <a href="revised_manuscript.pdf" target="_blank" rel="noopener">open it in a new tab</a>.
    </p>
  </div>
</main>

<script>
document.body.classList.remove('no-js');

/* iframes get their src only once their panel is on screen, so the plot is
   measured at its real size instead of 0x0 inside a hidden tab */
function loadVisibleFrames(){
  requestAnimationFrame(() => {
    document.querySelectorAll('iframe[data-src]').forEach(f => {
      if (f.offsetParent !== null) {
        f.src = f.dataset.src;
        f.removeAttribute('data-src');
      }
    });
  });
}

function showPanel(key){
  document.querySelectorAll('.tabs-l1 button').forEach(b =>
    b.classList.toggle('active', b.dataset.panel === key));
  document.querySelectorAll('.panel').forEach(p =>
    p.classList.toggle('active', p.id === 'panel-' + key));
  loadVisibleFrames();
}

function showSub(id){
  const panel = document.getElementById(id).closest('.panel');
  panel.querySelectorAll('.tabs-l2 button').forEach(b =>
    b.classList.toggle('active', b.dataset.sub === id));
  panel.querySelectorAll('.subpanel').forEach(s =>
    s.classList.toggle('active', s.id === id));
  loadVisibleFrames();
}

document.querySelectorAll('.tabs-l1 button').forEach(b =>
  b.addEventListener('click', () => {
    showPanel(b.dataset.panel);
    history.replaceState(null, '', '#' + b.dataset.panel);
  }));

document.querySelectorAll('.tabs-l2 button').forEach(b =>
  b.addEventListener('click', () => {
    showSub(b.dataset.sub);
    history.replaceState(null, '', '#' + b.dataset.sub);
  }));

/* deep links: #MbXe, #MbXe_ablation, #manuscript */
(function fromHash(){
  const hash = decodeURIComponent(location.hash.slice(1));
  const sub  = hash && document.getElementById(hash);
  if (sub && sub.classList.contains('subpanel')) {
    showPanel(hash.split('_')[0]);
    showSub(hash);
  } else if (hash && document.getElementById('panel-' + hash)) {
    showPanel(hash);
  }
  loadVisibleFrames();
})();
</script>
</body>
</html>
