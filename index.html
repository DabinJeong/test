<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebuttal — Supplementary Materials</title>
<style>
  :root{
    --paper:#f7f5f0;
    --ink:#1c2b2a;
    --ink-soft:#5c6b68;
    --line:#d8d3c6;
    --accent:#2f5d5a;
    --accent-soft:#e4ece9;
    --code-bg:#eeeae0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    line-height:1.6;
  }
  header{
    padding:2.5rem 2rem 1.5rem;
    border-bottom:1px solid var(--line);
    max-width:1000px;
    margin:0 auto;
  }
  header .kicker{
    font-family:"IBM Plex Mono",Menlo,Consolas,monospace;
    font-size:0.72rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:0.5rem;
  }
  header h1{
    font-size:1.9rem;
    margin:0;
    font-weight:600;
  }
  header p.sub{
    color:var(--ink-soft);
    font-size:0.95rem;
    margin:0.4rem 0 0;
  }

  main{max-width:1000px;margin:0 auto;padding:0 2rem 4rem;}

  /* ---- Level 1 tabs: reviewers ---- */
  nav.tabs-l1{
    display:flex;
    gap:0.25rem;
    margin-top:1.5rem;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  nav.tabs-l1 button{
    font-family:"IBM Plex Mono",Menlo,Consolas,monospace;
    font-size:0.82rem;
    background:none;
    border:none;
    padding:0.7rem 1.1rem;
    cursor:pointer;
    color:var(--ink-soft);
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    transition:color .15s ease, border-color .15s ease;
  }
  nav.tabs-l1 button:hover{color:var(--ink);}
  nav.tabs-l1 button.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
    font-weight:600;
  }

  /* ---- Level 2 tabs: topics within a reviewer ---- */
  nav.tabs-l2{
    display:flex;
    gap:0.5rem;
    flex-wrap:wrap;
    margin:1.5rem 0 2rem;
  }
  nav.tabs-l2 button{
    font-family:"IBM Plex Mono",Menlo,Consolas,monospace;
    font-size:0.76rem;
    background:var(--code-bg);
    border:1px solid var(--line);
    border-radius:999px;
    padding:0.35rem 0.85rem;
    cursor:pointer;
    color:var(--ink-soft);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  nav.tabs-l2 button:hover{border-color:var(--accent);}
  nav.tabs-l2 button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }

  .panel{display:none;}
  .panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:translateY(0);}}

  .subpanel{display:none;}
  .subpanel.active{display:block;}

  figure{margin:1.75rem 0;}
  figure img{
    width:100%;
    display:block;
    border:1px solid var(--line);
    background:#fff;
  }
  figcaption{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-top:0.6rem;
  }
  figcaption b{color:var(--ink);}

  table{
    width:100%;
    border-collapse:collapse;
    margin:1.5rem 0;
    font-size:0.85rem;
  }
  th,td{
    padding:0.5rem 0.7rem;
    border-bottom:1px solid var(--line);
    text-align:left;
  }
  th{
    font-family:"IBM Plex Mono",Menlo,Consolas,monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-soft);
  }
  td.best{font-weight:700; color:var(--accent);}

  h2.section-title{
    font-size:1.05rem;
    margin:0 0 0.25rem;
  }
  p.note{color:var(--ink-soft); font-size:0.9rem;}

  .pdf-wrap{
    margin-top:1.75rem;
    border:1px solid var(--line);
    background:#fff;
  }
  .pdf-wrap iframe{
    width:100%;
    height:85vh;
    border:none;
    display:block;
  }
  .figure-row{
    display:flex;
    gap:1.5rem;
    margin:1.75rem 0;
    align-items:flex-start;
  }
  .figure-row figure{
    flex:1 1 0;
    min-width:0;
    margin:0;
  }
  .figure-row .pdf-wrap{
    margin-top:0;
  }
  .figure-row .pdf-wrap iframe{
    height:480px;
  }
  /* the 3D plot needs more room than a flat bar chart */
  .figure-row figure:first-child{flex:1.35 1 0;}
  .figure-row figure img{
    height:480px;
    width:100%;
    object-fit:contain;
    background:#fff;
  }
  @media (max-width:720px){
    .figure-row{flex-direction:column;}
  }
  .pdf-fallback{
    padding:1.5rem;
    font-size:0.9rem;
    color:var(--ink-soft);
  }
  .pdf-fallback a{color:var(--accent);}

  ::selection{background:var(--accent-soft);}
</style>
</head>
<body>

  <nav class="tabs-l1" id="tabsL1"></nav>

/* ---------------------------------------------------------
   Standalone top-level tabs that aren't part of the reviewer/topic structure
   (e.g. Revised Manuscript — single block of content, no sub-tabs)
--------------------------------------------------------- */
const EXTRA_TABS = {
  "manuscript": {
    label: "Revised Manuscript",
    html: `
      <div class="pdf-wrap">
        <iframe src="revised_manuscript.pdf" title="Revised Manuscript"></iframe>
      </div>
      <p class="pdf-fallback">
        If the PDF doesn't display, <a href="revised_manuscript.pdf" target="_blank">open it in a new tab</a>.
      </p>
    `
  }
};

/* ---------------------------------------------------------
   Rendering logic (no need to modify)
--------------------------------------------------------- */
const tabsL1 = document.getElementById('tabsL1');
const panelsL1 = document.getElementById('panelsL1');

function slugify(s){ return s.replace(/\s+/g,'-').toLowerCase(); }

Object.entries(DATA).forEach(([key, reviewer], i) => {
  // level-1 button
  const btn = document.createElement('button');
  btn.textContent = reviewer.label;
  btn.dataset.target = key;
  if (i === 0) btn.classList.add('active');
  btn.addEventListener('click', () => activateL1(key));
  tabsL1.appendChild(btn);

  // level-1 panel
  const panel = document.createElement('div');
  panel.className = 'panel' + (i === 0 ? ' active' : '');
  panel.id = 'panel-' + key;

  const l2nav = document.createElement('nav');
  l2nav.className = 'tabs-l2';

  const l2panels = document.createElement('div');

  Object.entries(reviewer.topics).forEach(([topicKey, html], j) => {
    const topicId = key + '__' + slugify(topicKey);

    const l2btn = document.createElement('button');
    l2btn.textContent = topicKey;
    if (j === 0) l2btn.classList.add('active');
    l2btn.addEventListener('click', () => activateL2(key, topicId));
    l2btn.dataset.topicId = topicId;
    l2nav.appendChild(l2btn);

    const sub = document.createElement('div');
    sub.className = 'subpanel' + (j === 0 ? ' active' : '');
    sub.id = topicId;
    sub.innerHTML = html;
    l2panels.appendChild(sub);
  });

  // single-topic reviewers: no sub-tab bar, keep the vertical rhythm
  if (Object.keys(reviewer.topics).length < 2) {
    l2nav.style.display = 'none';
    panel.style.paddingTop = '2rem';
  }

  panel.appendChild(l2nav);
  panel.appendChild(l2panels);
  panelsL1.appendChild(panel);
});

Object.entries(EXTRA_TABS).forEach(([key, tab]) => {
  const btn = document.createElement('button');
  btn.textContent = tab.label;
  btn.dataset.target = key;
  btn.addEventListener('click', () => activateL1(key));
  tabsL1.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = 'panel-' + key;
  panel.innerHTML = tab.html;
  panelsL1.appendChild(panel);
});

function loadVisibleFrames(){
  requestAnimationFrame(() => {
    document.querySelectorAll('iframe[data-src]').forEach(f => {
      if (f.offsetParent !== null) {          /* only once actually laid out */
        f.src = f.dataset.src;
        f.removeAttribute('data-src');
      }
    });
  });
}

function activateL1(key){
  document.querySelectorAll('#tabsL1 button').forEach(b =>
    b.classList.toggle('active', b.dataset.target === key));
  document.querySelectorAll('.panel').forEach(p =>
    p.classList.toggle('active', p.id === 'panel-' + key));
  history.replaceState(null, '', '#' + key);
  loadVisibleFrames();
}

function activateL2(reviewerKey, topicId){
  const panel = document.getElementById('panel-' + reviewerKey);
  panel.querySelectorAll('.tabs-l2 button').forEach(b =>
    b.classList.toggle('active', b.dataset.topicId === topicId));
  panel.querySelectorAll('.subpanel').forEach(s =>
    s.classList.toggle('active', s.id === topicId));
  history.replaceState(null, '', '#' + topicId);
  loadVisibleFrames();
}

/* Deep-linking via URL hash: #t8Qj or #t8Qj__lm-init style, #manuscript also supported */
(function initFromHash(){
  const hash = location.hash.replace('#','');
  if (!hash) { loadVisibleFrames(); return; }
  const [reviewerKey, topicPart] = hash.split('__');
  if (DATA[reviewerKey]) {
    activateL1(reviewerKey);
    if (topicPart) {
      activateL2(reviewerKey, hash);
    }
  } else if (EXTRA_TABS[hash]) {
    activateL1(hash);
  }
  loadVisibleFrames();
})();
</script>
